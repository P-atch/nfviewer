name: Synchronize with Gitlab

on:
  schedule:
    - cron: "0 * * * *" # Every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch the Github repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize from GitLab
        run: |
          git remote add gitlab \
            "https://gitlab.com/P-atch/nfviewer.git"

          git fetch gitlab main

          git push origin FETCH_HEAD:main